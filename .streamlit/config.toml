[theme]
primaryColor = "#2a78d6"

[server]
# Listen on THIS computer only. Without this, Streamlit also serves your local
# network, so anyone on your Wi-Fi could open the app and press its buttons
# (including the kill switch).
address = "127.0.0.1"
# no "enter your email" prompt on first launch (open http://127.0.0.1:8501 yourself,
# or use run_dashboard.bat which opens the browser for you)
headless = true

[browser]
# don't send anonymous usage statistics to Streamlit
gatherUsageStats = false
